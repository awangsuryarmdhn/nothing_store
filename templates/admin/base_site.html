{% extends "admin/base.html" %}
{% load static %}

{# Override admin base to load CSS from CDN when static files fail #}

{% block extrastyle %}
{{ block.super }}
{# Fallback CSS if WhiteNoise static fails #}
<style>
/* Django Admin Fallback Styles - Essential Layout */
body {
    font-family: "Segoe UI", system-ui, Roboto, -apple-system, sans-serif;
    font-size: 14px;
    color: #333;
    background: #fff;
    margin: 0;
    padding: 0;
}

#header {
    background: #417690;
    color: #ffc;
    padding: 10px 40px;
}

#header a:link, #header a:visited {
    color: #fff;
}

#branding h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 400;
}

#user-tools {
    float: right;
    font-size: 11px;
}

#user-tools a {
    color: #ffc;
    text-decoration: none;
}

#container {
    padding: 10px 40px;
}

#content {
    padding: 20px;
}

.module {
    background: #f8f8f8;
    border: 1px solid #ccc;
    margin-bottom: 20px;
    border-radius: 4px;
}

.module caption, .module table caption {
    background: #79aec8;
    color: #fff;
    padding: 8px 10px;
    font-weight: 600;
}

.module table {
    width: 100%;
    border-collapse: collapse;
}

.module table td, .module table th {
    padding: 8px 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.module table th {
    background: #f0f0f0;
}

a:link, a:visited {
    color: #447e9b;
    text-decoration: none;
}

a:hover {
    color: #205067;
}

input[type="text"], input[type="password"], textarea, select {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
}

input[type="submit"], button, .button {
    background: #417690;
    color: #fff;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
}

input[type="submit"]:hover, button:hover, .button:hover {
    background: #205067;
}

.breadcrumbs {
    background: #79aec8;
    padding: 10px 40px;
    color: #c4dce8;
    font-size: 11px;
}

.breadcrumbs a {
    color: #fff;
}

/* Object Tools */
.object-tools {
    float: right;
    padding: 0;
    margin: 0 0 10px;
    list-style: none;
}

.object-tools li {
    display: inline-block;
    margin-left: 5px;
}

.object-tools a {
    background: #999;
    color: #fff;
    padding: 5px 10px;
    border-radius: 15px;
    font-size: 11px;
}

.object-tools a:hover {
    background: #417690;
}

/* Messages */
.messagelist {
    padding: 0;
    margin: 0 0 20px;
}

.messagelist li {
    padding: 10px 15px;
    margin-bottom: 3px;
    border-radius: 4px;
}

.messagelist li.success {
    background: #dfd;
}

.messagelist li.warning {
    background: #ffc;
}

.messagelist li.error {
    background: #fdd;
}

/* Sidebar */
#nav-sidebar {
    background: #f8f8f8;
    border-right: 1px solid #ddd;
    padding: 20px;
    width: 250px;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
}

/* Hide broken theme selector images */
#header img[src*="theme"] {
    display: none;
}
</style>
{% endblock %}
